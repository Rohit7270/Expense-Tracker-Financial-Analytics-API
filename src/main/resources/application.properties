# ===================== Application =====================
spring.application.name=expense-tracker-api
server.port=8080

# ===================== PostgreSQL Datasource =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/expense_tracker
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

# ===================== JWT =====================
# 256-bit base64 secret (change this in production / externalize via env var)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ===================== CORS =====================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8080

# ===================== Actuator =====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===================== Logging =====================
logging.level.com.expensetracker=INFO
logging.level.org.springframework.security=WARN
